<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SANDBOX — Mobile Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: rgba(255,255,255,0.07);
    --accent: #7c6dfa;
    --accent2: #fa6d8f;
    --accent3: #6dfabd;
    --text: #e8e8f0;
    --text-muted: rgba(232,232,240,0.4);
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; height: 100vh; width: 100vw; }
  #three-canvas { position: fixed; inset: 0; z-index: 0; }

  /* ── TOP BAR ── */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; background: linear-gradient(to bottom, rgba(10,10,15,0.95) 0%, transparent 100%);
    pointer-events: none;
  }
  .logo { font-family: var(--mono); font-size: 13px; letter-spacing: 4px; text-transform: uppercase; color: var(--text-muted); }
  .logo span { color: var(--accent); }
  .top-status { font-family: var(--mono); font-size: 10px; letter-spacing: 2px; color: var(--text-muted); display: flex; align-items: center; gap: 16px; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #444; display: inline-block; transition: background 0.3s; }
  .status-dot.active { background: var(--accent3); box-shadow: 0 0 8px var(--accent3); }

  /* ── LEFT PANEL ── */
  .left-panel { position: fixed; left: 16px; top: 50%; transform: translateY(-50%); z-index: 50; display: flex; flex-direction: column; gap: 8px; }
  .panel-section { background: rgba(18,18,26,0.9); border: 1px solid var(--border); border-radius: 14px; padding: 14px; backdrop-filter: blur(20px); min-width: 150px; }
  .panel-label { font-family: var(--mono); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
  
  .add-btn {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: 9px; border: 1px solid var(--border); background: transparent;
    color: var(--text); font-family: var(--sans); font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.2s; margin-bottom: 6px;
  }
  .add-btn:last-child { margin-bottom: 0; }
  .add-btn:hover { background: rgba(124,109,250,0.15); border-color: rgba(124,109,250,0.4); transform: translateX(3px); }

  .toggle-btn {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border); background: transparent;
    color: var(--text-muted); font-family: var(--mono); font-size: 10px; cursor: pointer; transition: all 0.2s;
  }
  .toggle-btn.on { border-color: rgba(109,250,189,0.4); background: rgba(109,250,189,0.08); color: var(--accent3); }
  .toggle-switch { width: 28px; height: 16px; border-radius: 8px; background: #333; position: relative; transition: background 0.2s; flex-shrink: 0; }
  .toggle-btn.on .toggle-switch { background: var(--accent3); }
  .toggle-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
  .toggle-btn.on .toggle-switch::after { transform: translateX(12px); }

  .clear-btn {
    width: 100%; padding: 9px 12px; border-radius: 9px; border: 1px solid rgba(250,109,143,0.25);
    background: transparent; color: rgba(250,109,143,0.7); font-family: var(--mono); font-size: 10px;
    cursor: pointer; transition: all 0.2s; text-transform: uppercase;
  }
  .clear-btn:hover { background: rgba(250,109,143,0.1); color: var(--accent2); border-color: var(--accent2); }

  /* ── WEBCAM FEED OVERLAY ── */
  #webcam-container {
    position: fixed; bottom: 16px; right: 16px; z-index: 60; border-radius: 12px; overflow: hidden;
    border: 1px solid var(--border); box-shadow: 0 8px 32px rgba(0,0,0,0.5); display: none; width: 160px; height: 120px; background: #000;
  }
  #webcam-container.visible { display: block; }
  #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; position: absolute; inset: 0; z-index: 1; }
  #tracking-canvas { position: absolute; inset: 0; width: 100%; height: 100%; transform: scaleX(-1); z-index: 2; }
  .webcam-label { position: absolute; bottom: 0; left: 0; right: 0; padding: 4px 8px; background: linear-gradient(transparent, rgba(0,0,0,0.8)); font-family: var(--mono); font-size: 8px; color: var(--accent3); text-transform: uppercase; z-index: 3; }

  /* ── GESTURE FEEDBACK BADGE ── */
  .gesture-badge {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 100;
    background: rgba(18,18,26,0.9); border: 1px solid rgba(124,109,250,0.3); border-radius: 30px;
    padding: 8px 20px; font-family: var(--mono); font-size: 10px; letter-spacing: 2px; color: var(--accent);
    text-transform: uppercase; opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  .gesture-badge.show { opacity: 1; }

  /* ── INSTRUCTIONS OVERLAY ── */
  .color-selector {
    display: flex; gap: 4px; margin-top: 8px; justify-content: space-between;
  }
  .color-dot {
    flex: 1; height: 20px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: transform 0.2s;
  }
  .color-dot:hover { transform: scale(1.05); }
  .color-dot.active { border-color: #fff; box-shadow: 0 0 8px currentColor; }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/tracking-min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div class="gesture-badge" id="gestureBadge">READY</div>

<div class="top-bar">
  <div class="logo">SAND<span>BOX</span> — Mobile</div>
  <div class="top-status">
    <span class="status-dot" id="trackingDot"></span>
    <span id="trackingLabel">TRACK OFF</span>
    &nbsp;|&nbsp;
    <span id="objectCount">0 OBJECTS</span>
  </div>
</div>

<div class="left-panel">
  <div class="panel-section">
    <div class="panel-label">Add Object</div>
    <button class="add-btn" onclick="addObject('cube')">⬜ Cube</button>
    <button class="add-btn" onclick="addObject('sphere')">🔵 Sphere</button>
    <button class="add-btn" onclick="addObject('cylinder')">🟢 Cylinder</button>
  </div>
  
  <div class="panel-section">
    <div class="panel-label">Color Pointer</div>
    <button class="toggle-btn" id="trackingBtn" onclick="toggleTracking()">
      <span>COLOR TRACK</span>
      <div class="toggle-switch"></div>
    </button>
    <div class="color-selector">
      <div class="color-dot active" style="background:#ff0000; color:#ff0000;" onclick="selectTrackColor('magenta', this)"></div>
      <div class="color-dot" style="background:#00ff00; color:#00ff00;" onclick="selectTrackColor('cyan', this)"></div>
      <div class="color-dot" style="background:#ffff00; color:#ffff00;" onclick="selectTrackColor('yellow', this)"></div>
    </div>
  </div>

  <div class="panel-section">
    <button class="clear-btn" onclick="clearScene()">✕ Clear All</button>
  </div>
</div>

<div id="webcam-container">
  <video id="webcam" width="320" height="240" autoplay playsinline muted></video>
  <canvas id="tracking-canvas" width="320" height="240"></canvas>
  <div class="webcam-label">● TARGET LOOKUP</div>
</div>

<canvas id="three-canvas"></canvas>

<script>
// ── THREE.JS ENGINE GRAPHICS BASE ──
const canvas = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.setClearColor(0x0a0a0f, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0f, 0.035);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 5, 10);
camera.lookAt(0, 0.5, 0);

const ambientLight = new THREE.AmbientLight(0x1a1a3a, 1.5); scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 2.5); dirLight.position.set(8, 12, 6); dirLight.castShadow = true; scene.add(dirLight);

const gridHelper = new THREE.GridHelper(40, 40, 0x1a1a2e, 0x12121e); scene.add(gridHelper);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x0d0d15, roughness: 0.9 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; ground.position.y = -0.01; scene.add(ground);

// ── SCENE ENTITY CONTROLLER ──
let objects = []; let selectedObject = null; let objectIdCounter = 0;
const COLORS = [0x7c6dfa, 0xfa6d8f, 0x6dfabd, 0xfac96d];

function addObject(type) {
  const color = COLORS[objectIdCounter % COLORS.length];
  let geometry;
  if (type === 'cube') geometry = new THREE.BoxGeometry(1, 1, 1);
  else if (type === 'sphere') geometry = new THREE.SphereGeometry(0.6, 24, 24);
  else if (type === 'cylinder') geometry = new THREE.CylinderGeometry(0.5, 0.5, 1.2, 24);

  const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color, roughness: 0.4, metalness: 0.2 }));
  mesh.position.set((Math.random() - 0.5) * 3, 0.6, (Math.random() - 0.5) * 3);
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.userData = { id: ++objectIdCounter, type, color };

  const outline = new THREE.Mesh(geometry.clone(), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.BackSide }));
  outline.scale.setScalar(1.06); outline.visible = false; mesh.add(outline); mesh.userData.outline = outline;

  scene.add(mesh); objects.push(mesh); selectObject(mesh); updateObjectCount();
}

function selectObject(obj) {
  if (selectedObject) {
    selectedObject.material.emissive.set(0x000000);
    if (selectedObject.userData.outline) selectedObject.userData.outline.visible = false;
  }
  selectedObject = obj;
  if (obj) {
    obj.material.emissive = new THREE.Color(obj.userData.color).multiplyScalar(0.3);
    if (obj.userData.outline) obj.userData.outline.visible = true;
  }
}

function clearScene() { objects.forEach(obj => scene.remove(obj)); objects = []; selectObject(null); updateObjectCount(); }
function updateObjectCount() { document.getElementById('objectCount').textContent = objects.length + ' OBJECTS'; }

function showGesture(text) { const el = document.getElementById('gestureBadge'); el.textContent = text; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1500); }

// ── NATIVE CLIENT-SIDE COLOR TRACKING ENGINE ──
let trackingTracker = null;
let trackingTask = null;
let activeColorTarget = 'magenta'; 
let trackingLive = false;

// Register customized tracking filters directly into the local environment
tracking.ColorTracker.registerColor('magenta', (r, g, b) => (r > 130 && g < 70 && b > 100)); // Pink/Red targets
tracking.ColorTracker.registerColor('cyan', (r, g, b) => (r < 70 && g > 130 && b > 130));    // Bright Green/Cyan targets
tracking.ColorTracker.registerColor('yellow', (r, g, b) => (r > 140 && g > 140 && b < 70));  // Yellow targets

function selectTrackColor(colorName, element) {
  activeColorTarget = colorName;
  document.querySelectorAll('.color-dot').forEach(el => el.classList.remove('active'));
  element.classList.add('active');
  if (trackingLive) {
    toggleTracking(); // Cycle tracker to instantly update matrix mapping target
    toggleTracking();
  }
}

function toggleTracking() {
  const btn = document.getElementById('trackingBtn');
  const dot = document.getElementById('trackingDot');
  const label = document.getElementById('trackingLabel');
  const container = document.getElementById('webcam-container');
  const video = document.getElementById('webcam');

  if (trackingLive) {
    trackingLive = false;
    if (trackingTask) { trackingTask.stop(); trackingTask = null; }
    if (video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; }
    btn.classList.remove('on');
    dot.classList.remove('active');
    label.textContent = 'TRACK OFF';
    container.classList.remove('visible');
    return;
  }

  label.textContent = 'STARTING...';

  // Instant direct hardware camera initialization pass
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 320, height: 240 }, audio: false })
    .then((stream) => {
      video.srcObject = stream;
      video.play();

      trackingTracker = new tracking.ColorTracker([activeColorTarget]);
      trackingTracker.setMinDimension(10);
      trackingTracker.setEdgesDensity(0.1);

      // Frame mapping event pass loop runs entirely inside the client sandbox
      trackingTracker.on('track', (event) => {
        const tCanvas = document.getElementById('tracking-canvas');
        const ctx = tCanvas.getContext('2d');
        ctx.clearRect(0, 0, 320, 240);

        if (event.data.length === 0) return;

        // Take the primary matched color coordinate
        const rect = event.data[0];

        // Draw visual feedback onto the tracking monitor box
        ctx.strokeStyle = '#6dfabd'; ctx.lineWidth = 3;
        ctx.strokeRect(rect.x, rect.y, rect.width, rect.height);

        // Map 2D camera viewport percentages into normalized 3D viewport spatial values
        const centerX = rect.x + (rect.width / 2);
        const centerY = rect.y + (rect.height / 2);
        
        const normX = ((centerX / 320) - 0.5) * -2; // Mirrored coordinate orientation layout adjustment
        const normY = -((centerY / 240) - 0.5) * 2;

        // Perform vector transformation computation
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(new THREE.Vector2(normX, normY), camera);
        
        const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        const worldIntersection = new THREE.Vector3();
        raycaster.ray.intersectPlane(groundPlane, worldIntersection);

        // Move target dynamically with continuous dampening interpolation matrix updates
        if (selectedObject && worldIntersection) {
          selectedObject.position.x += (worldIntersection.x - selectedObject.position.x) * 0.25;
          selectedObject.position.z += (worldIntersection.z - selectedObject.position.z) * 0.25;
        }
      });

      trackingTask = tracking.track('#webcam', trackingTracker);
      trackingLive = true;
      btn.classList.add('on');
      dot.classList.add('active');
      label.textContent = 'TRACK LIVE';
      container.classList.add('visible');
      showGesture('TRACKER READY');
    })
    .catch((err) => {
      console.error(err);
      label.textContent = 'CAM ERROR';
      showGesture('CAMERA PERMISSION DENIED');
    });
}

// ── GRAPHICS ENGINE ANIMATION RENDER PASS ──
function animate() {
  requestAnimationFrame(animate);
  objects.forEach(obj => {
    if (obj !== selectedObject) {
      obj.rotation.y += 0.004;
      obj.position.y = 0.5 + Math.sin(Date.now() * 0.002 + obj.userData.id) * 0.03;
    }
  });
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Seed immediate initial block workspace geometry
window.addEventListener('load', () => { addObject('cube'); });
</script>
</body>
</html>
