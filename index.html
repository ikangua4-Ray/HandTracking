<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SANDBOX — 3D Hand Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: rgba(255,255,255,0.07);
    --accent: #7c6dfa;
    --accent2: #fa6d8f;
    --accent3: #6dfabd;
    --text: #e8e8f0;
    --text-muted: rgba(232,232,240,0.4);
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #three-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  /* ── TOP BAR ── */
  .top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: linear-gradient(to bottom, rgba(10,10,15,0.95) 0%, transparent 100%);
    pointer-events: none;
  }

  .logo {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .logo span { color: var(--accent); }

  .top-status {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #444;
    display: inline-block;
    transition: background 0.3s;
  }
  .status-dot.active { background: var(--accent3); box-shadow: 0 0 8px var(--accent3); }

  /* ── LEFT PANEL ── */
  .left-panel {
    position: fixed;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 50;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .panel-section {
    background: rgba(18,18,26,0.85);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    backdrop-filter: blur(20px);
    min-width: 160px;
  }

  .panel-label {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .add-btn {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 6px;
  }
  .add-btn:last-child { margin-bottom: 0; }
  .add-btn:hover {
    background: rgba(124,109,250,0.15);
    border-color: rgba(124,109,250,0.4);
    color: #fff;
    transform: translateX(3px);
  }

  .toggle-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .toggle-btn.on {
    border-color: rgba(109,250,189,0.4);
    background: rgba(109,250,189,0.08);
    color: var(--accent3);
  }

  .toggle-switch {
    width: 28px; height: 16px;
    border-radius: 8px;
    background: #333;
    position: relative;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .toggle-btn.on .toggle-switch { background: var(--accent3); }
  .toggle-switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 12px; height: 12px; border-radius: 50%; background: #fff;
    transition: transform 0.2s;
  }
  .toggle-btn.on .toggle-switch::after { transform: translateX(12px); }

  .clear-btn {
    width: 100%; padding: 9px 12px; border-radius: 9px;
    border: 1px solid rgba(250,109,143,0.25); background: transparent;
    color: rgba(250,109,143,0.7); font-family: var(--mono); font-size: 10px;
    letter-spacing: 1px; cursor: pointer; transition: all 0.2s; text-transform: uppercase;
  }
  .clear-btn:hover { background: rgba(250,109,143,0.1); color: var(--accent2); border-color: var(--accent2); }

  /* ── RIGHT PANEL ── */
  .right-panel {
    position: fixed; right: 20px; top: 50%; transform: translateY(-50%); z-index: 50;
    background: rgba(18,18,26,0.85); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; backdrop-filter: blur(20px); min-width: 200px; transition: opacity 0.3s;
  }
  .right-panel.empty { opacity: 0.3; }
  .prop-title { font-family: var(--mono); font-size: 9px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 14px; }
  .prop-type { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .prop-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .prop-key { font-family: var(--mono); font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }
  .prop-val { font-family: var(--mono); font-size: 11px; color: var(--text); }
  .prop-group { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .prop-group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .prop-group-label { font-family: var(--mono); font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: rgba(124,109,250,0.6); margin-bottom: 8px; }

  /* ── BOTTOM HINTS ── */
  .bottom-hints {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 50;
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; pointer-events: none;
  }
  .hint-chip { background: rgba(18,18,26,0.8); border: 1px solid var(--border); border-radius: 30px; padding: 6px 14px; font-family: var(--mono); font-size: 9px; letter-spacing: 1px; color: var(--text-muted); backdrop-filter: blur(10px); white-space: nowrap; }
  .hint-chip span { color: var(--accent); }

  /* ── WEBCAM MONITOR OVERLAY ── */
  #webcam-container {
    position: fixed; bottom: 20px; right: 20px; z-index: 60; border-radius: 12px; overflow: hidden;
    border: 1px solid var(--border); box-shadow: 0 8px 32px rgba(0,0,0,0.5); display: none; width: 200px; height: 150px; background: #000;
  }
  #webcam-container.visible { display: block; }
  #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; position: absolute; inset: 0; z-index: 1; }
  #hand-canvas { position: absolute; inset: 0; width: 100%; height: 100%; transform: scaleX(-1); z-index: 2; }
  .webcam-label { position: absolute; bottom: 0; left: 0; right: 0; padding: 6px 10px; background: linear-gradient(transparent, rgba(0,0,0,0.8)); font-family: var(--mono); font-size: 8px; letter-spacing: 1.5px; color: var(--accent3); text-transform: uppercase; z-index: 3; }

  /* ── CURSOR ── */
  #cursor {
    position: fixed; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--accent);
    pointer-events: none; z-index: 200; transform: translate(-50%, -50%); transition: width 0.15s, height 0.15s, border-color 0.15s, background 0.15s; mix-blend-mode: screen;
  }
  #cursor.hover { width: 26px; height: 26px; border-color: var(--accent3); background: rgba(109,250,189,0.15); }
  #cursor.grab { width: 22px; height: 22px; border-color: var(--accent2); background: rgba(250,109,143,0.2); border-width: 3px; }
  #cursor.pinch { width: 12px; height: 12px; border-color: #fff; background: rgba(255,255,255,0.3); }

  /* ── GESTURE FEEDBACK ── */
  .gesture-badge {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 100;
    background: rgba(18,18,26,0.9); border: 1px solid rgba(124,109,250,0.3); border-radius: 30px;
    padding: 8px 20px; font-family: var(--mono); font-size: 10px; letter-spacing: 2px; color: var(--accent);
    text-transform: uppercase; opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  .gesture-badge.show { opacity: 1; }

  /* ── LOADING SCREEN ── */
  .loading-screen {
    position: fixed; inset: 0; background: var(--bg); z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; transition: opacity 0.6s;
  }
  .loading-screen.hide { opacity: 0; pointer-events: none; }
  .loading-logo { font-family: var(--mono); font-size: 28px; letter-spacing: 8px; color: var(--text-muted); }
  .loading-logo span { color: var(--accent); }
  .loading-bar { width: 200px; height: 1px; background: var(--border); border-radius: 1px; overflow: hidden; }
  .loading-fill { height: 100%; background: var(--accent); width: 0%; transition: width 1.5s ease; box-shadow: 0 0 10px var(--accent); }
</style>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm/vision_bundle.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-logo">SAND<span>BOX</span></div>
  <div class="loading-bar"><div class="loading-fill" id="loadingFill"></div></div>
</div>

<div id="cursor"></div>
<div class="gesture-badge" id="gestureBadge">IDLE</div>

<div class="top-bar">
  <div class="logo">SAND<span>BOX</span> — 3D Builder</div>
  <div class="top-status">
    <span class="status-dot" id="trackingDot"></span>
    <span id="trackingLabel">TRACKING OFF</span>
    &nbsp;|&nbsp;
    <span id="objectCount">0 OBJECTS</span>
  </div>
</div>

<div class="left-panel">
  <div class="panel-section">
    <div class="panel-label">Add Object</div>
    <button class="add-btn" onclick="addObject('cube')">⬜ Cube</button>
    <button class="add-btn" onclick="addObject('sphere')">🔵 Sphere</button>
    <button class="add-btn" onclick="addObject('cylinder')">🟢 Cylinder</button>
    <button class="add-btn" onclick="addObject('cone')">🔺 Cone</button>
  </div>
  <div class="panel-section">
    <div class="panel-label">Controls</div>
    <button class="toggle-btn" id="trackingBtn" onclick="toggleTracking()">
      <span>HAND TRACK</span>
      <div class="toggle-switch"></div>
    </button>
  </div>
  <div class="panel-section">
    <button class="clear-btn" onclick="clearScene()">✕ Clear All</button>
  </div>
</div>

<div class="right-panel empty" id="rightPanel">
  <div class="prop-title">Properties</div>
  <div id="propContent">
    <div style="font-family:var(--mono); font-size:10px; color:var(--text-muted); line-height:1.6;">Select an object<br>to view its<br>properties.</div>
  </div>
</div>

<div class="bottom-hints">
  <div class="hint-chip"><span>CLICK</span> Select</div>
  <div class="hint-chip"><span>DRAG</span> Move</div>
  <div class="hint-chip"><span>RIGHT DRAG</span> Orbit</div>
  <div class="hint-chip"><span>SCROLL</span> Zoom</div>
  <div class="hint-chip"><span>PINCH</span> Grab (hand)</div>
</div>

<div id="webcam-container">
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="hand-canvas" width="200" height="150"></canvas>
  <div class="webcam-label">● HAND TRACKING LIVE</div>
</div>

<canvas id="three-canvas"></canvas>

<script>
// ── THREE.JS GRAPHICS BASE ──
const canvas = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.setClearColor(0x0a0a0f, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0f, 0.035);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 6, 12);

const ambientLight = new THREE.AmbientLight(0x1a1a3a, 1.5); scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 2.5); dirLight.position.set(8, 12, 6); dirLight.castShadow = true; scene.add(dirLight);

const gridHelper = new THREE.GridHelper(40, 40, 0x1a1a2e, 0x12121e); gridHelper.position.y = -0.01; scene.add(gridHelper);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x0d0d15, roughness: 0.9 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; ground.position.y = -0.02; scene.add(ground);

let spherical = { theta: 0.3, phi: 0.8, radius: 14 };
function updateCameraFromSpherical() {
  camera.position.x = spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
  camera.position.y = spherical.radius * Math.cos(spherical.phi);
  camera.position.z = spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
  camera.lookAt(0, 0.5, 0);
}
updateCameraFromSpherical();

// ── CORE ENTITY MANAGEMENT ──
let objects = []; let selectedObject = null; let objectIdCounter = 0;
let isDragging = false; let dragPlane = new THREE.Plane(); let dragOffset = new THREE.Vector3();
let mouse = new THREE.Vector2(); let raycaster = new THREE.Raycaster(); let trackingEnabled = false;

const COLORS = [0x7c6dfa, 0xfa6d8f, 0x6dfabd, 0xfac96d];

function addObject(type) {
  const color = COLORS[objectIdCounter % COLORS.length];
  let geometry;
  if (type === 'cube') geometry = new THREE.BoxGeometry(1, 1, 1);
  else if (type === 'sphere') geometry = new THREE.SphereGeometry(0.6, 32, 32);
  else if (type === 'cylinder') geometry = new THREE.CylinderGeometry(0.5, 0.5, 1.2, 32);
  else if (type === 'cone') geometry = new THREE.ConeGeometry(0.6, 1.2, 32);

  const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.3 }));
  mesh.position.set((Math.random() - 0.5) * 3, 0.7, (Math.random() - 0.5) * 3);
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.userData = { id: ++objectIdCounter, type, color };

  const outline = new THREE.Mesh(geometry.clone(), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.BackSide }));
  outline.scale.setScalar(1.04); outline.visible = false; mesh.add(outline); mesh.userData.outline = outline;

  scene.add(mesh); objects.push(mesh); selectObject(mesh); updateObjectCount();
}

function selectObject(obj) {
  if (selectedObject) {
    selectedObject.material.emissive.set(0x000000);
    if (selectedObject.userData.outline) selectedObject.userData.outline.visible = false;
  }
  selectedObject = obj;
  if (obj) {
    obj.material.emissive = new THREE.Color(obj.userData.color).multiplyScalar(0.25);
    if (obj.userData.outline) obj.userData.outline.visible = true;
    updateProperties(obj);
    document.getElementById('rightPanel').classList.remove('empty');
  } else {
    document.getElementById('rightPanel').classList.add('empty');
    document.getElementById('propContent').innerHTML = `<div style="font-family:var(--mono); font-size:10px; color:var(--text-muted); line-height:1.6;">Select an object<br>to view its<br>properties.</div>`;
  }
}

function updateProperties(obj) {
  if (!obj) return;
  const p = obj.position, s = obj.scale;
  document.getElementById('propContent').innerHTML = `
    <div class="prop-type">${obj.userData.type.toUpperCase()} #${obj.userData.id}</div>
    <div class="prop-group">
      <div class="prop-group-label">Position</div>
      <div class="prop-row"><span class="prop-key">X</span><span class="prop-val">${p.x.toFixed(2)}</span></div>
      <div class="prop-row"><span class="prop-key">Y</span><span class="prop-val">${p.y.toFixed(2)}</span></div>
      <div class="prop-row"><span class="prop-key">Z</span><span class="prop-val">${p.z.toFixed(2)}</span></div>
    </div>`;
}

function clearScene() { objects.forEach(obj => scene.remove(obj)); objects = []; selectObject(null); updateObjectCount(); }
function updateObjectCount() { document.getElementById('objectCount').textContent = objects.length + ' OBJECTS'; }

// ── MOUSE/TOUCH MAPPING CONTROLS ──
const cursorEl = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cursorEl.style.left = e.clientX + 'px'; cursorEl.style.top = e.clientY + 'px';
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1; mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  if (isDragging && selectedObject) {
    raycaster.setFromCamera(mouse, camera); const target = new THREE.Vector3(); raycaster.ray.intersectPlane(dragPlane, target);
    if (target) { selectedObject.position.copy(target.sub(dragOffset)); selectedObject.position.y = Math.max(0.3, selectedObject.position.y); updateProperties(selectedObject); }
  }
});

document.addEventListener('mousedown', e => {
  raycaster.setFromCamera(mouse, camera); const intersects = raycaster.intersectObjects(objects);
  if (intersects.length > 0) {
    const hit = intersects[0].object; selectObject(hit); isDragging = true; cursorEl.className = 'grab';
    dragPlane.setFromNormalAndCoplanarPoint(camera.position.clone().normalize(), hit.position);
    const target = new THREE.Vector3(); raycaster.ray.intersectPlane(dragPlane, target); dragOffset.copy(target).sub(hit.position);
  } else { selectObject(null); }
});
document.addEventListener('mouseup', () => { isDragging = false; cursorEl.className = ''; });
document.addEventListener('wheel', e => { spherical.radius = Math.max(3, Math.min(40, spherical.radius + e.deltaY * 0.02)); updateCameraFromSpherical(); });

function showGesture(text) { const el = document.getElementById('gestureBadge'); el.textContent = text; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1500); }

// ── NEW PRODUCTION GESTURE VISION STATE ENGINE ──
let handLandmarker = null;
let mediaStreamObject = null;
let lastVideoTime = -1;
let handGrabbing = false;
let prevHandAngle = null, prevHandSpread = null;
const smoothBuf = { x: [], y: [], angle: [], spread: [] };

function smooth(buf, val) { buf.push(val); if (buf.length > 4) buf.shift(); return buf.reduce((a, b) => a + b, 0) / buf.length; }

// Initialize the single-file Vision framework globally
async function initVisionEngine() {
  if (handLandmarker) return true;
  try {
    // Loads the complete unified webassembly engine securely from Google's direct storage edge CDN
    const filesetResolver = await MediaPipeTasksVision.FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm"
    );
    handLandmarker = await MediaPipeTasksVision.HandLandmarker.createFromOptions(filesetResolver, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker_bundle/float16/1/hand_landmarker_bundle.task",
        delegate: "GPU"
      },
      runningMode: "VIDEO",
      numHands: 1
    });
    return true;
  } catch (err) {
    console.error("Vision Engine load failed", err);
    return false;
  }
}

async function toggleTracking() {
  const btn = document.getElementById('trackingBtn');
  const dot = document.getElementById('trackingDot');
  const label = document.getElementById('trackingLabel');
  const container = document.getElementById('webcam-container');
  const video = document.getElementById('webcam');

  if (trackingEnabled) {
    trackingEnabled = false;
    btn.classList.remove('on');
    dot.classList.remove('active');
    label.textContent = 'TRACKING OFF';
    container.classList.remove('visible');
    if (mediaStreamObject) { mediaStreamObject.getTracks().forEach(t => t.stop()); mediaStreamObject = null; }
    video.srcObject = null;
    return;
  }

  label.textContent = 'LOADING MODULES...';

  const ready = await initVisionEngine();
  if (!ready) {
    label.textContent = 'CDN ERROR';
    showGesture('ASSET FETCH BLOCKED BY BROWSER');
    return;
  }

  label.textContent = 'AWAITING CAM...';

  try {
    mediaStreamObject = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 320 }, height: { ideal: 240 }, facingMode: "user" },
      audio: false
    });
    
    video.srcObject = mediaStreamObject;
    video.addEventListener('loadeddata', () => {
      video.play();
      trackingEnabled = true;
      btn.classList.add('on');
      dot.classList.add('active');
      label.textContent = 'TRACKING ON';
      container.classList.add('visible');
      showGesture('CAMERA CORE ACTIVE');
      requestAnimationFrame(renderTrackingLoop);
    });
  } catch (err) {
    label.textContent = 'CAM PERMISSION DENIED';
    showGesture('ALLOW CAMERA ACCESS IN BROWSER SETTINGS');
  }
}

function renderTrackingLoop() {
  if (!trackingEnabled) return;

  const video = document.getElementById('webcam');
  const hCanvas = document.getElementById('hand-canvas');
  const ctx = hCanvas.getContext('2d');

  if (video.currentTime !== lastVideoTime && video.readyState >= 2) {
    lastVideoTime = video.currentTime;
    const startTimeMs = performance.now();
    const results = handLandmarker.detectForVideo(video, startTimeMs);

    ctx.clearRect(0, 0, 200, 150);

    if (results.landmarks && results.landmarks.length > 0) {
      const kp = results.landmarks[0];

      // Draw wireframe overlay pass
      ctx.strokeStyle = '#6dfabd'; ctx.lineWidth = 2;
      const CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
      CONNECTIONS.forEach(([a, b]) => {
        if (kp[a] && kp[b]) { ctx.beginPath(); ctx.moveTo(kp[a].x*200, kp[a].y*150); ctx.lineTo(kp[b].x*200, kp[b].y*150); ctx.stroke(); }
      });

      const thumb = kp[4], index = kp[8], pinky = kp[20], wrist = kp[0], midMcp = kp[9];
      const isPinching = Math.hypot(thumb.x - index.x, thumb.y - index.y) < 0.08;
      const spread = smooth(smoothBuf.spread, Math.hypot(pinky.x - index.x, pinky.y - index.y));
      const handAngle = smooth(smoothBuf.angle, Math.atan2(midMcp.y - wrist.y, midMcp.x - wrist.x));

      const sx = smooth(smoothBuf.x, index.x), sy = smooth(smoothBuf.y, index.y);
      const normX = (1 - sx - 0.5) * 2, normY = -(sy - 0.5) * 2;

      const ray = new THREE.Raycaster();
      ray.setFromCamera(new THREE.Vector2(normX, normY), camera);
      const worldPt = new THREE.Vector3();
      ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), worldPt);

      if (isPinching) {
        if (!handGrabbing) {
          if (!selectedObject) {
            let best = null, bestD = Infinity;
            objects.forEach(obj => {
              const d = obj.position.distanceTo(worldPt.clone().setY(obj.position.y));
              if (d < bestD) { bestD = d; best = obj; }
            });
            if (best && bestD < 4) selectObject(best);
          }
          handGrabbing = true; cursorEl.className = 'pinch'; showGesture('GRAB');
        }
        if (selectedObject && worldPt.x !== undefined) {
          selectedObject.position.x += (worldPt.x - selectedObject.position.x) * 0.2;
          selectedObject.position.z += (worldPt.z - selectedObject.position.z) * 0.2;
          updateProperties(selectedObject);
        }
      } else {
        if (handGrabbing) { handGrabbing = false; cursorEl.className = ''; }
      }

      if (prevHandAngle !== null && selectedObject && !isPinching) {
        const dAngle = handAngle - prevHandAngle;
        if (Math.abs(dAngle) > 0.006 && Math.abs(dAngle) < 0.2) { selectedObject.rotation.y += dAngle * 2.2; updateProperties(selectedObject); }
      }
      if (prevHandSpread !== null && selectedObject && !isPinching) {
        const dSpread = spread - prevHandSpread;
        if (Math.abs(dSpread) > 0.006) { selectedObject.scale.multiplyScalar(1 + dSpread * 3.5); selectedObject.scale.clampScalar(0.15, 5); updateProperties(selectedObject); }
      }

      prevHandAngle = handAngle; prevHandSpread = spread;
    } else {
      if (handGrabbing) { handGrabbing = false; cursorEl.className = ''; }
      prevHandAngle = null; prevHandSpread = null;
    }
  }
  requestAnimationFrame(renderTrackingLoop);
}

// ── MAIN ANIMATION LOOP ──
function animate() {
  requestAnimationFrame(animate);
  objects.forEach(obj => {
    if (obj !== selectedObject) {
      obj.rotation.y += 0.003;
      obj.position.y = 0.6 + Math.sin(Date.now() * 0.0015 + obj.userData.id) * 0.04;
    }
  });
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

window.addEventListener('load', () => {
  setTimeout(() => { document.getElementById('loadingFill').style.width = '100%'; }, 100);
  setTimeout(() => { document.getElementById('loadingScreen').classList.add('hide'); }, 1000);
  setTimeout(() => addObject('cube'), 1200);
});
</script>
</body>
